[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "case-explainer"
version = "0.1.1"
description = "General-purpose case-based explainability for machine learning"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Paul Whitten", email = "pcw@case.edu" },
]
keywords = [
    "explainability",
    "interpretability",
    "machine-learning",
    "case-based-reasoning",
    "nearest-neighbors",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.3.0",
    "pandas>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "build>=0.10.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/paulwhitten/case-explainer"
Documentation = "https://paulwhitten.github.io/case-explainer/"
Repository = "https://github.com/paulwhitten/case-explainer"
"Bug Tracker" = "https://github.com/paulwhitten/case-explainer/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["case_explainer*"]
